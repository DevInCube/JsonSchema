name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test --no-build -c Release

      - name: JSON Schema Test Suite
        run: dotnet run --project My.Json.Schema.TestConsole --no-build -c Release | tee suite-output.txt

      - name: Generate badge data
        run: |
          badge_color() {
            local p=$1
            if   [ "$p" -ge 100 ]; then echo "brightgreen"
            elif [ "$p" -ge 90  ]; then echo "green"
            elif [ "$p" -ge 75  ]; then echo "yellow"
            else echo "red"; fi
          }

          make_badges() {
            local DRAFT=$1
            local LINE
            LINE=$(grep "^SUITE_RESULT draft=${DRAFT} " suite-output.txt)

            local MAIN_S MAIN_F MAIN_E OPT_S OPT_F OPT_E
            MAIN_S=$(echo "$LINE" | grep -oP 'mandatory_success=\K\d+')
            MAIN_F=$(echo "$LINE" | grep -oP 'mandatory_failed=\K\d+')
            MAIN_E=$(echo "$LINE" | grep -oP 'mandatory_exceptions=\K\d+')
            OPT_S=$(echo "$LINE"  | grep -oP 'optional_success=\K\d+')
            OPT_F=$(echo "$LINE"  | grep -oP 'optional_failed=\K\d+')
            OPT_E=$(echo "$LINE"  | grep -oP 'optional_exceptions=\K\d+')

            local MAIN_TOTAL OPT_TOTAL MAIN_PCT OPT_PCT
            MAIN_TOTAL=$((MAIN_S + MAIN_F + MAIN_E))
            OPT_TOTAL=$((OPT_S  + OPT_F  + OPT_E))
            MAIN_PCT=$((MAIN_S * 100 / MAIN_TOTAL))
            OPT_PCT=$((OPT_S  * 100 / OPT_TOTAL))

            printf '{"schemaVersion":1,"label":"%s mandatory tests","message":"%s/%s (%s%%)","color":"%s"}\n' \
              "$DRAFT" "$MAIN_S" "$MAIN_TOTAL" "$MAIN_PCT" "$(badge_color "$MAIN_PCT")" \
              > "badges/${DRAFT}-mandatory-tests.json"
            printf '{"schemaVersion":1,"label":"%s optional tests","message":"%s/%s (%s%%)","color":"%s"}\n' \
              "$DRAFT" "$OPT_S" "$OPT_TOTAL" "$OPT_PCT" "$(badge_color "$OPT_PCT")" \
              > "badges/${DRAFT}-optional-tests.json"

            echo "${DRAFT} mandatory: $MAIN_S/$MAIN_TOTAL ($MAIN_PCT%)"
            echo "${DRAFT} optional:  $OPT_S/$OPT_TOTAL ($OPT_PCT%)"
          }

          mkdir -p badges
          make_badges "draft4"
          make_badges "draft6"
          make_badges "draft7"
          make_badges "draft2019-09"

      - name: Commit badge data
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/
          git diff --staged --quiet || git commit -m "chore: update test suite badges [skip ci]"
          git push
